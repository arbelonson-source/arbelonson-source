<svg xmlns="http://www.w3.org/2000/svg" width="600" height="506" viewBox="0 0 600 506" role="img" aria-label="Building software for the people at my table. Private by design: no accounts, no ads, no tracking.">
  <title>Building software for the people at my table. Private by design: no accounts, no ads, no tracking.</title>
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#F2B263" stop-opacity="0.55"/><stop offset="1" stop-color="#F2B263" stop-opacity="0"/></radialGradient>
    <clipPath id="clip0"><rect x="40" y="364" width="250" height="34" rx="17"/></clipPath><clipPath id="clip1"><rect x="40" y="402" width="300" height="34" rx="17"/></clipPath><clipPath id="clip2"><rect x="40" y="440" width="290" height="34" rx="17"/></clipPath>
  </defs>
  <style>.cv0{transform:translateX(250px)}.cv1{transform:translateX(300px)}.cv2{transform:translateX(290px)}

  .h{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;font-weight:700;fill:#232733}
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500;fill:#6A6558}
  .c{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:17px;fill:#232733}
  .glow{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    .glow{animation:breathe 9s ease-in-out infinite;transform-origin:505px 108px}
    .line{animation:fade 18s linear infinite}
    .cv0{animation:cv0 18s cubic-bezier(.4,0,.2,1) infinite}
    .cv1{animation:cv1 18s cubic-bezier(.4,0,.2,1) infinite}
    .cv2{animation:cv2 18s cubic-bezier(.4,0,.2,1) infinite}
  }
  @keyframes breathe{0%,100%{opacity:.72;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
  @keyframes fade{0%{opacity:0}3%{opacity:1}88%{opacity:1}95%,100%{opacity:0}}
  @keyframes cv0{0%,8%{transform:translateX(0)}20%,100%{transform:translateX(250px)}}
  @keyframes cv1{0%,30%{transform:translateX(0)}42%,100%{transform:translateX(300px)}}
  @keyframes cv2{0%,52%{transform:translateX(0)}64%,100%{transform:translateX(290px)}}
  .cover{transform:translateX(0px)}
  </style>
  <rect width="600" height="506" rx="24" fill="#F4ECDF"/>

  <g class="glow"><circle cx="505" cy="108" r="96" fill="url(#g)"/></g>
  <g transform="translate(505 52) scale(0.8)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-42 64 L-24 12 L24 12 L42 64 Z" fill="#C9701A" fill-opacity=".9" stroke="#C9701A" stroke-width="3"/>
    <path d="M0 64 V120" stroke="#232733" stroke-opacity=".55" stroke-width="5"/>
    <path d="M-28 128 Q0 118 28 128" stroke="#232733" stroke-opacity=".55" stroke-width="5"/>
  </g>
<text class="h" x="40" y="134" font-size="40">Building software</text>
<text class="h" x="40" y="184" font-size="40">for the people</text>
<text class="h" x="40" y="234" font-size="40">at my table.</text>
<text class="s" x="40" y="286" font-size="19">Private by design: no accounts,</text>
<text class="s" x="40" y="314" font-size="19">no ads, no tracking.</text>

  <g class="line" aria-hidden="true">
    <rect x="40" y="364" width="250" height="34" rx="17" fill="#FFFDF8" stroke="#E6DAC6"/>
    <circle cx="59" cy="381" r="4" fill="#C9701A"/>
    <text class="c" x="74" y="387">Dinner is ready.</text>
    <g clip-path="url(#clip0)"><rect class="cv0" x="70" y="363" width="250" height="36" fill="#FFFDF8"/></g>
  </g>
  <g class="line" aria-hidden="true">
    <rect x="40" y="402" width="300" height="34" rx="17" fill="#FFFDF8" stroke="#E6DAC6"/>
    <circle cx="59" cy="419" r="4" fill="#C9701A"/>
    <text class="c" x="74" y="425">Sit down, everyone.</text>
    <g clip-path="url(#clip1)"><rect class="cv1" x="70" y="401" width="300" height="36" fill="#FFFDF8"/></g>
  </g>
  <g class="line" aria-hidden="true">
    <rect x="40" y="440" width="290" height="34" rx="17" fill="#FFFDF8" stroke="#E6DAC6"/>
    <circle cx="59" cy="457" r="4" fill="#C9701A"/>
    <text class="c" x="74" y="463">Can you hear me now?</text>
    <g clip-path="url(#clip2)"><rect class="cv2" x="70" y="439" width="290" height="36" fill="#FFFDF8"/></g>
  </g>
</svg>
