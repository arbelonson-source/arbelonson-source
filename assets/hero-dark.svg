<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="384" viewBox="0 0 1280 384" role="img" aria-label="Building software for the people at my table. Private by design: no accounts, no ads, no tracking.">
  <title>Building software for the people at my table. Private by design: no accounts, no ads, no tracking.</title>
  <defs>
    <radialGradient id="g"><stop offset="0" stop-color="#F0A354" stop-opacity="0.38"/><stop offset="1" stop-color="#F0A354" stop-opacity="0"/></radialGradient>
    <clipPath id="clip0"><rect x="840" y="228" width="250" height="34" rx="17"/></clipPath><clipPath id="clip1"><rect x="840" y="270" width="300" height="34" rx="17"/></clipPath><clipPath id="clip2"><rect x="840" y="312" width="290" height="34" rx="17"/></clipPath>
  </defs>
  <style>.cv0{transform:translateX(250px)}.cv1{transform:translateX(300px)}.cv2{transform:translateX(290px)}

  .h{font-family:Georgia, 'Iowan Old Style', 'Palatino Linotype', serif;font-weight:700;fill:#EDE9E2}
  .s{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-weight:500;fill:#A9A89F}
  .c{font-family:-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif;font-size:17px;fill:#EDE9E2}
  .glow{opacity:1}
  @media (prefers-reduced-motion:no-preference){
    .glow{animation:breathe 9s ease-in-out infinite;transform-origin:1020px 106px}
    .line{animation:fade 18s linear infinite}
    .cv0{animation:cv0 18s cubic-bezier(.4,0,.2,1) infinite}
    .cv1{animation:cv1 18s cubic-bezier(.4,0,.2,1) infinite}
    .cv2{animation:cv2 18s cubic-bezier(.4,0,.2,1) infinite}
  }
  @keyframes breathe{0%,100%{opacity:.72;transform:scale(.97)}50%{opacity:1;transform:scale(1.03)}}
  @keyframes fade{0%{opacity:0}3%{opacity:1}88%{opacity:1}95%,100%{opacity:0}}
  @keyframes cv0{0%,8%{transform:translateX(0)}20%,100%{transform:translateX(250px)}}
  @keyframes cv1{0%,30%{transform:translateX(0)}42%,100%{transform:translateX(300px)}}
  @keyframes cv2{0%,52%{transform:translateX(0)}64%,100%{transform:translateX(290px)}}
  .cover{transform:translateX(0px)}
  </style>
  <rect width="1280" height="384" rx="24" fill="#1D2128"/>

  <g class="glow"><circle cx="1020" cy="106" r="120" fill="url(#g)"/></g>
  <g transform="translate(1020 36) scale(1)" fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M-42 64 L-24 12 L24 12 L42 64 Z" fill="#F0A354" fill-opacity=".9" stroke="#F0A354" stroke-width="3"/>
    <path d="M0 64 V120" stroke="#EDE9E2" stroke-opacity=".55" stroke-width="5"/>
    <path d="M-28 128 Q0 118 28 128" stroke="#EDE9E2" stroke-opacity=".55" stroke-width="5"/>
  </g>
<text class="h" x="72" y="152" font-size="54">Building software for</text>
<text class="h" x="72" y="218" font-size="54">the people at my table.</text>
<text class="s" x="74" y="274" font-size="23">Private by design: no accounts, no ads, no tracking.</text>

  <g class="line" aria-hidden="true">
    <rect x="840" y="228" width="250" height="34" rx="17" fill="#272C35" stroke="#343A45"/>
    <circle cx="859" cy="245" r="4" fill="#F0A354"/>
    <text class="c" x="874" y="251">Dinner is ready.</text>
    <g clip-path="url(#clip0)"><rect class="cv0" x="870" y="227" width="250" height="36" fill="#272C35"/></g>
  </g>
  <g class="line" aria-hidden="true">
    <rect x="840" y="270" width="300" height="34" rx="17" fill="#272C35" stroke="#343A45"/>
    <circle cx="859" cy="287" r="4" fill="#F0A354"/>
    <text class="c" x="874" y="293">Sit down, everyone.</text>
    <g clip-path="url(#clip1)"><rect class="cv1" x="870" y="269" width="300" height="36" fill="#272C35"/></g>
  </g>
  <g class="line" aria-hidden="true">
    <rect x="840" y="312" width="290" height="34" rx="17" fill="#272C35" stroke="#343A45"/>
    <circle cx="859" cy="329" r="4" fill="#F0A354"/>
    <text class="c" x="874" y="335">Can you hear me now?</text>
    <g clip-path="url(#clip2)"><rect class="cv2" x="870" y="311" width="290" height="36" fill="#272C35"/></g>
  </g>
</svg>
